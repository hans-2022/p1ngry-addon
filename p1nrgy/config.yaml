# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: p1nrgy TEST HD
version: "0.0.4"
slug: p1nrgy
description: p1nrgy add-on to read data from a p1nrgy smart meter and publish it to MQTT
url: "https://github.com/hans-2022/p1ngry-addon"
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:need
map:
  - share:rw
uart: true
usb: true
options:
  dsmr_enabled: true
  dsmr_mode: "serial"
  dsmr_serial_device: "/dev/serial/by-id/..."
  dsmr_serial_baud: 115200
  dsmr_serial_databits: 8
  dsmr_serial_parity: "N"
  dsmr_serial_stopbits: 1
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_client_id: "p1nrgy_hass_addon"
  mqtt_topic: "p1nrgy/data"
schema:
  dsmr_enabled: bool
  dsmr_mode: str
  dsmr_serial_device: "device(subsystem=tty)"
  dsmr_serial_baud: int
  dsmr_serial_databits: int
  dsmr_serial_parity: str
  dsmr_serial_stopbits: int
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_client_id: str
  mqtt_topic: str
# image: "ghcr.io/erwindouna/p1nrgy" # TODO: Uncomment this line to use a prebuilt image
